<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Xainner — Founder Engineer &amp; AI Architect">
  <title>Xainner — Founder Engineer &amp; AI Architect</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0716"/>
      <stop offset="0.55" stop-color="#120B24"/>
      <stop offset="1" stop-color="#07050F"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F5F3FF"/>
      <stop offset="0.45" stop-color="#C4B5FD"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="orbA"><stop offset="0" stop-color="#7C3AED" stop-opacity=".55"/><stop offset="1" stop-color="#7C3AED" stop-opacity="0"/></radialGradient>
    <radialGradient id="orbB"><stop offset="0" stop-color="#22D3EE" stop-opacity=".28"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></radialGradient>
    <radialGradient id="orbC"><stop offset="0" stop-color="#EC4899" stop-opacity=".22"/><stop offset="1" stop-color="#EC4899" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#A78BFA" stroke-opacity=".07" stroke-width="1"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="340" rx="22"/></clipPath>
    <style>
      .t { font-family: 'Segoe UI', 'Inter', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif; }
      .m { font-family: 'JetBrains Mono', 'Cascadia Code', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; }
      .float1 { animation: f1 14s ease-in-out infinite; }
      .float2 { animation: f2 18s ease-in-out infinite; }
      .float3 { animation: f3 16s ease-in-out infinite; }
      @keyframes f1 { 0%,100% { transform: translate(0,0) } 50% { transform: translate(60px,30px) } }
      @keyframes f2 { 0%,100% { transform: translate(0,0) } 50% { transform: translate(-80px,-20px) } }
      @keyframes f3 { 0%,100% { transform: translate(0,0) } 50% { transform: translate(40px,-40px) } }
      .scan { animation: scan 6s linear infinite; }
      @keyframes scan { from { transform: translateX(-700px) } to { transform: translateX(1200px) } }
      .caret { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0 } }
      .roll { animation: roll 12s cubic-bezier(.7,0,.3,1) infinite; }
      @keyframes roll {
        0%, 22%   { transform: translateY(0) }
        25%, 47%  { transform: translateY(-30px) }
        50%, 72%  { transform: translateY(-60px) }
        75%, 97%  { transform: translateY(-90px) }
        100%      { transform: translateY(-120px) }
      }
      .pulse { animation: pulse 2.4s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
      @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .35 } }
      @media (prefers-reduced-motion: reduce) {
        .float1, .float2, .float3, .scan, .caret, .roll, .pulse { animation: none; }
      }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect width="1200" height="340" fill="url(#grid)"/>
    <circle class="float1" cx="980" cy="60" r="260" fill="url(#orbA)"/>
    <circle class="float2" cx="1120" cy="300" r="220" fill="url(#orbB)"/>
    <circle class="float3" cx="140" cy="340" r="240" fill="url(#orbC)"/>
    <rect class="scan" x="0" y="0" width="520" height="340" fill="url(#line)" opacity=".05"/>
  </g>
  <rect x=".5" y=".5" width="1199" height="339" rx="22" fill="none" stroke="#A78BFA" stroke-opacity=".25"/>

  <!-- status chip -->
  <g transform="translate(72 64)">
    <rect width="236" height="30" rx="15" fill="#A78BFA" fill-opacity=".1" stroke="#A78BFA" stroke-opacity=".35"/>
    <circle class="pulse" cx="18" cy="15" r="4.5" fill="#4ADE80"/>
    <text class="m" x="32" y="20" font-size="13" fill="#DDD6FE" letter-spacing=".5">building · San José, CR</text>
  </g>

  <text class="t" x="68" y="178" font-size="92" font-weight="800" fill="url(#name)" letter-spacing="-3">Xainner</text>
  <text class="t" x="74" y="220" font-size="24" font-weight="500" fill="#E9E5FF" letter-spacing=".3">Founder Engineer <tspan fill="#8B5CF6">·</tspan> AI Architect</text>

  <!-- rolling prompt -->
  <g transform="translate(74 256)">
    <text class="m" x="0" y="21" font-size="17" fill="#8B5CF6">❯</text>
    <svg x="22" y="0" width="720" height="30" overflow="hidden">
      <g class="roll">
        <text class="m" x="0" y="21" font-size="17" fill="#C4B5FD">agentes de IA que trabajan en tu terminal y escritorio</text>
        <text class="m" x="0" y="51" font-size="17" fill="#C4B5FD">plataformas SaaS de punta a punta, en producción</text>
        <text class="m" x="0" y="81" font-size="17" fill="#C4B5FD">apps nativas con Electron, Tauri y Rust</text>
        <text class="m" x="0" y="111" font-size="17" fill="#C4B5FD">infra self-hosted, automatización y MCP</text>
        <text class="m" x="0" y="141" font-size="17" fill="#C4B5FD">agentes de IA que trabajan en tu terminal y escritorio</text>
      </g>
    </svg>
  </g>

  <!-- terminal card -->
  <g transform="translate(790 70)">
    <rect width="340" height="200" rx="14" fill="#0B0716" fill-opacity=".72" stroke="#A78BFA" stroke-opacity=".3"/>
    <circle cx="20" cy="20" r="5" fill="#F87171"/><circle cx="38" cy="20" r="5" fill="#FBBF24"/><circle cx="56" cy="20" r="5" fill="#4ADE80"/>
    <text class="m" x="200" y="24" font-size="11" fill="#A78BFA" fill-opacity=".7">~/rinari</text>
    <line x1="0" y1="38" x2="340" y2="38" stroke="#A78BFA" stroke-opacity=".18"/>
    <text class="m" font-size="13" fill="#E9E5FF">
      <tspan x="18" y="64"><tspan fill="#8B5CF6">$</tspan> rinari plan "ship v1"</tspan>
      <tspan x="18" y="88" fill="#94A3B8">› mapping repository…</tspan>
      <tspan x="18" y="112" fill="#94A3B8">› 3 agents · tools · approvals</tspan>
      <tspan x="18" y="136"><tspan fill="#4ADE80">✓</tspan> tests passed · diff ready</tspan>
      <tspan x="18" y="168"><tspan fill="#8B5CF6">$</tspan> rinari desktop .</tspan>
    </text>
    <rect class="caret" x="160" y="156" width="8" height="16" fill="#C4B5FD"/>
  </g>
</svg>
